<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#222222">
<title>ANTONIOS</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --left-w: 320px; --right-w: 390px; --azul: #366E8D; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: #f5f5f5; font-family: Oswald, Arial, sans-serif; overflow: hidden; }

  /* Barra azul superior, ancho completo y título centrado */
  .bar { flex-shrink: 0; background: var(--azul); color: #FFF; text-align: center; font-weight: 500; font-size: 1.4em; padding: 7px; }

  /* Tres columnas fijas: canales | reproductor | programación */
  .layout { flex: 1; min-height: 0; display: grid; grid-template-columns: var(--left-w) 1fr var(--right-w); }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: #f5f5f5; }

  .stage { position: relative; min-width: 0; background: #000; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  #status {
    position: absolute; left: 0; right: 0; top: 0; z-index: 2; padding: 6px 12px; pointer-events: none;
    background: rgba(0,0,0,.55); color: #fff; font-weight: 300; font-size: 1em; transition: opacity .5s;
  }
  #status.error { background: rgba(160,0,0,.8); }
  #status.hide { opacity: 0; }

  /* Pantalla completa (nativa + respaldo por CSS por si el navegador la bloquea) */
  body.full .stage { position: fixed; inset: 0; z-index: 100; }
  #exitBtn {
    display: none; position: absolute; top: 12px; right: 12px; z-index: 3; font-family: Oswald, Arial; font-size: 1em;
    background: rgba(0,0,0,.65); color: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 3px; padding: 5px 12px; cursor: pointer;
  }
  body.full.show-exit #exitBtn { display: block; }

  @media (max-width: 900px) { :root { --left-w: 220px; --right-w: 280px; } }
</style>
</head>
<body>

<!--  <div class="bar">ANTONIOS</div> -->

<div class="layout">
  <iframe id="fCanales" src="canales_plat.html" title="Canales"></iframe>

  <div class="stage" id="stage">
    <div id="status" role="status">Elige un canal o un evento</div>
    <button id="exitBtn">Salir de pantalla completa (Esc)</button>
    <video id="video" controls autoplay playsinline></video>
  </div>

  <iframe id="fCalendario" src="calendario_plat.html" title="Programación"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script>
/* ===== Ajustes ===== */
const ENGINE = "http://127.0.0.1:6878";   // Dirección del Ace Stream Engine
const FULLSCREEN_DELAY = 10000;           // Milisegundos hasta pasar a pantalla completa

const $ = id => document.getElementById(id);
const video = $("video"), stage = $("stage");
const fCanales = $("fCanales"), fCalendario = $("fCalendario");
let hls = null, fsTimer = null, statusTimer = null, exitTimer = null;

function resolveUrl(link) {
  link = String(link || "").trim();
  if (!link) return null;
  if (/^https?:\/\//i.test(link)) return link;
  const m = link.match(/[0-9a-fA-F]{40}/);
  return m ? ENGINE.replace(/\/$/, "") + "/ace/manifest.m3u8?id=" + m[0].toLowerCase() : null;
}

function setStatus(t, err, autoHide) {
  const s = $("status");
  clearTimeout(statusTimer);
  s.textContent = t;
  s.classList.toggle("error", !!err);
  s.classList.remove("hide");
  if (autoHide) statusTimer = setTimeout(() => s.classList.add("hide"), 3000);
}

/* ===== Pantalla completa ===== */
function enterFull() {
  if (document.body.classList.contains("full")) return;
  document.body.classList.add("full");
  try {
    const p = stage.requestFullscreen && stage.requestFullscreen();
    if (p && p.catch) p.catch(() => {});   // si el navegador la bloquea, queda el modo CSS
  } catch (e) {}
  window.focus();
}
function exitFull() {
  document.body.classList.remove("full", "show-exit");
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement) exitFull(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") exitFull(); });
$("exitBtn").onclick = exitFull;
stage.addEventListener("mousemove", () => {
  if (!document.body.classList.contains("full")) return;
  document.body.classList.add("show-exit");
  clearTimeout(exitTimer);
  exitTimer = setTimeout(() => document.body.classList.remove("show-exit"), 3000);
});

/* ===== Reproducción ===== */
function play(link, label) {
  clearTimeout(fsTimer);
  const url = resolveUrl(link);
  if (!url) { setStatus("\"" + label + "\" no tiene un enlace válido.", true); return; }

  setStatus("Conectando con " + label + "... puede tardar unos segundos");
  //fsTimer = setTimeout(enterFull, FULLSCREEN_DELAY);

  if (hls) { hls.destroy(); hls = null; }
  if (window.Hls && Hls.isSupported()) {
    hls = new Hls();
    hls.on(Hls.Events.MANIFEST_PARSED, () => { setStatus("Reproduciendo: " + label, false, true); video.play().catch(() => {}); });
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) setStatus("No se pudo reproducir. Comprueba el enlace y que el Engine está en ejecución.", true); });
    hls.loadSource(url); hls.attachMedia(video);
  } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
    video.src = url; video.play().catch(() => {});
  } else {
    setStatus("Este navegador no soporta HLS o no se pudo cargar hls.js (¿sin internet?).", true);
  }
}

/* ===== Mensajes desde canales_plat.html y calendario_plat.html ===== */
window.addEventListener("message", ev => {
  const d = ev.data;
  if (!d || d.tipo !== "reproducir") return;
  let otro;
  if (ev.source === fCanales.contentWindow) otro = fCalendario.contentWindow;
  else if (ev.source === fCalendario.contentWindow) otro = fCanales.contentWindow;
  else return;
  otro.postMessage({ tipo: "limpiar" }, "*");   // quita la marca de la otra lista
  play(d.enlace, d.nombre || "evento");
});
</script>
</body>
</html>
